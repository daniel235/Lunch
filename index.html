<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Weekly Meal Budget</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"><style id="css">
/* Layout idea: one phone-width column; a sticky budget header, then the week as a ledger and the shopping list as a till receipt. */
:root{
  --paper:#f2f5ee; --card:#ffffff; --ink:#17231c; --mute:#5b6a60; --line:#d7ded3;
  --green:#1c7a4a; --on-green:#ffffff; --tag:#f4c430; --on-tag:#372b00; --bad:#bf3a29; --soft:#e6ede2;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1611; --card:#172019; --ink:#e7eee6; --mute:#9aa99f; --line:#2b382f;
    --green:#58c088; --on-green:#0c140f; --tag:#f4c430; --on-tag:#2b2100; --bad:#f08573; --soft:#1e2a22;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1611; --card:#172019; --ink:#e7eee6; --mute:#9aa99f; --line:#2b382f;
  --green:#58c088; --on-green:#0c140f; --tag:#f4c430; --on-tag:#2b2100; --bad:#f08573; --soft:#1e2a22;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#app{max-width:680px;margin:0 auto;padding:0 16px 56px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.small{font-size:13.5px}

.top{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 0;border-bottom:1px solid var(--line)}
.brand{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.wk{font-size:13.5px;color:var(--mute);margin-top:2px}
.savebtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.savebtn.dirty{background:var(--tag);color:var(--on-tag);border-color:var(--tag)}
.savenote{font-size:12.5px;color:var(--mute);white-space:nowrap;padding-top:6px}
.bud{margin-top:12px}
.budrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.budrow b{font-family:var(--mono);font-size:24px;font-weight:500;letter-spacing:-.02em}
.budrow b.over{color:var(--bad)}
.budrow label{font-size:13.5px;color:var(--mute);display:flex;align-items:center;gap:4px}
.budrow input{width:72px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-family:var(--mono);text-align:right}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.bar i.over{background:var(--bad)}
.facts{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.facts .chip{background:var(--tag);color:var(--on-tag);border-radius:4px;padding:0 6px;font-weight:600}
.step{display:inline-flex;align-items:center;gap:6px}
.step button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--card);line-height:1;padding:0}
nav{display:flex;gap:2px;margin-top:10px}
nav a{flex:1;text-align:center;padding:9px 4px 8px;text-decoration:none;color:var(--mute);font-weight:600;font-size:14.5px;border-bottom:3px solid transparent}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--green)}
nav a .n{font-family:var(--mono);font-size:12px;font-weight:400}

section{padding-top:16px;display:flex;flex-direction:column;gap:12px}
.note{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600;text-align:center;text-decoration:none;color:var(--ink);display:inline-block}
.btn.go{background:var(--green);color:var(--on-green);border-color:var(--green)}
.btn.sm{padding:6px 10px;font-size:13.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 150px}

.day{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.day:last-of-type{border-bottom:0}
.dname{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.1;padding-top:8px}
.dname span{display:block;font:400 12.5px var(--mono);color:var(--mute);margin-top:2px}
.slots{display:flex;flex-direction:column;gap:6px;min-width:0}
.slot{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.slot .k{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mute);width:48px;flex:none}
.slot .m{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.slot.empty{background:transparent;border-style:dashed}
.slot.empty .m{color:var(--mute);font-weight:400}
.slot.left .m::before{content:"↻ ";color:var(--green)}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.row .sub{font-size:13px;color:var(--mute)}
.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--green);flex:none}
.row.off .grow,.row.off .amt{opacity:.45;text-decoration:line-through}
.amt{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pin{width:64px;padding:2px 4px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-family:var(--mono);font-size:13px;text-align:right}
.qin{width:58px;padding:5px 4px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-family:var(--mono);text-align:center}
.x{border:0;background:transparent;color:var(--mute);font-size:20px;line-height:1;padding:4px 6px}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;font-weight:600}
.total .amt{font-size:20px}
.stages{display:flex;gap:6px;font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.05em}
.stages span{flex:1;text-align:center;padding:6px 2px;border-radius:6px;background:var(--soft);color:var(--mute)}
.stages span.on{background:var(--ink);color:var(--paper)}
.stages span.done{background:var(--green);color:var(--on-green)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);padding:9px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.add{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.add input[type=text],.add select{flex:1 1 140px;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.add input[type=number]{width:76px;padding:9px 6px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-family:var(--mono)}
h2{font-size:18px;font-weight:700}
.tip{border-left:4px solid var(--tag);background:var(--card);border-radius:0 10px 10px 0;padding:10px 12px;font-size:14.5px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.tip.bad{border-left-color:var(--bad)}
.find{font-size:13px;font-weight:600;color:var(--green);text-decoration:underline;white-space:nowrap}
.err{color:var(--bad);font-size:14px}

#sheet .veil{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet .panel{background:var(--paper);width:100%;max-width:680px;max-height:82%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 24px}
#sheet .phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.opt{display:flex;width:100%;text-align:left;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px}
.opt .grow{flex:1;min-width:0}
.opt .sub{font-size:13px;color:var(--mute)}
.opt .amt.free{color:var(--green);font-weight:500}
.opt.cur{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s}}

var art=null,artDone=false,ai=null,saving=false,saveErr='',sheetKey=null,confirmNext=false,copied=false,aiBusy=false,aiErr='',draft={name:'',type:'D',ing:[]},msg='';

function weekView(){

function tips(rs){

  if(b>0&&t>b+0.005&&worst){var r=recipe(state.plan[worst]);out.push('<div class="tip bad"><span>You are '+usd(t-b)+' over budget. '+esc(FULL[+worst[0]])+'\'s '+esc(r?r.name.toLowerCase():'meal')+' adds the most ('+usd(ws)+').</span><button class="btn sm" data-a="pick" data-k="'+worst+'">See cheaper swaps</button></div>')}

function sheet(){
  if(!sheetKey){$('sheet').innerHTML='';return}
  var d=+sheetKey[0],m=sheetKey[1],cur=state.plan[sheetKey],p0=Object.assign({},state.plan);delete p0[sheetKey];var base=cost(p0);
  function opt(v,name,sub){var p=Object.assign({},p0);p[sheetKey]=v;var dl=cost(p)-base;
    return {dl:dl,html:'<button class="opt'+(cur===v?' cur':'')+'" data-a="set" data-k="'+esc(v)+'"><span class="grow">'+esc(name)+(sub?'<span class="sub"><br>'+sub+'</span>':'')+'</span><span class="amt'+(dl<0.005?' free':'')+'">'+(dl<0.005?'$0 extra':'+'+usd(dl))+'</span></button>'}}
  var h='<div class="veil" data-a="close"><div class="panel" role="dialog" aria-modal="true" aria-label="Choose a meal"><div class="phead"><h2>'+FULL[d]+' '+(m==='L'?'lunch':'dinner')+'</h2><button class="x" data-a="close" aria-label="Close">×</button></div><p class="mute small">Sorted by what each meal adds to this week\'s bill, given your pantry and what you are already buying.</p>';
  if(m==='L'&&d>0){var pr=slotRecipe(state.plan,d-1,'D');if(pr&&state.plan[(d-1)+'D']!=='left')h+=opt('left','Leftovers from '+FULL[d-1]+'\'s '+pr.name.toLowerCase(),'Cook a double batch the night before').html}
  h+=all().filter(function(r){return r.type==='B'||r.type===m}).map(function(r){var n=r.ing.filter(function(x){return (state.pantry[x[0]]||0)>0}).length;return opt(r.id,r.name,n?'Uses '+n+' thing'+(n>1?'s':'')+' you already have':'')}).sort(function(a,b){return a.dl-b.dl}).map(function(o){return o.html}).join('');
  h+='<button class="opt'+(cur==='out'?' cur':'')+'" data-a="set" data-k="out"><span class="grow">Eating out or skipping</span></button>';
  if(cur)h+='<button class="opt" data-a="set" data-k=""><span class="grow">Clear this slot</span></button>';
  $('sheet').innerHTML=h+'</div></div>'}

function render(){var t=tab();$('app').innerHTML=header()+'<section>'+(t==='week'?weekView():t==='pantry'?pantryView():t==='shopping'?shopView():recipesView())+'</section>';sheet()}

function autofill(){var cnt={},k;for(k in state.plan)cnt[state.plan[k]]=(cnt[state.plan[k]]||0)+1;
  ['D','L'].forEach(function(m){for(var d=0;d<7;d++){var key=d+m;if(state.plan[key])continue;var base=cost(state.plan),best=null,bc=1e9;
    all().forEach(function(r){if(r.type!=='B'&&r.type!==m)return;if((cnt[r.id]||0)>=2)return;if(state.plan[(d-1)+m]===r.id||state.plan[(d+1)+m]===r.id||state.plan[d+(m==='D'?'L':'D')]===r.id)return;
      var p=Object.assign({},state.plan);p[key]=r.id;var c=cost(p)-base+(cnt[r.id]?0.75:0);if(c<bc){bc=c;best=r}});
    if(best){state.plan[key]=best.id;cnt[best.id]=(cnt[best.id]||0)+1}}})}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function listText(){var S=STORES[state.store]||STORES.heb,a=wkDate(0),t='Groceries for the week of '+MON[a.getMonth()]+' '+a.getDate()+' ('+S[0]+')\n';
  rows(state.plan,state.pantry).forEach(function(r){if(r.packs>0&&!state.skip[r.k])t+='- '+amt(r.packs*r.pack,r.u)+' '+r.k+'\n'});state.extras.forEach(function(e){t+='- '+e.name+'\n'});return t}

    state.extras.forEach(function(e){state.spent+=e.price});state.extras=[];state.skip={};state.stage='ordered'},true)},
  dAdd:function(){draft.name=$('rn').value;draft.type=$('rt').value;var k=norm($('dn').value),q=parseFloat($('dq').value);if(!k||!(q>0))return;if(!CAT[k]&&!state.items[k]){var np=parseFloat($('dp').value);state.items[k]=[$('du').value||'each',1,np>0?np:2];state.editedAt=Date.now();store()}draft.ing.push([k,q]);render()},
  dDel:function(k){draft.name=$('rn').value;draft.type=$('rt').value;draft.ing.splice(+k,1);render()},
  dSave:function(){draft.name=$('rn').value.trim();draft.type=$('rt').value;if(!draft.name||!draft.ing.length){msg='Give the meal a name and at least one ingredient.';render();return}

    var q='You plan cheap family lunches and dinners. Pantry: '+pan+'. Known grocery items with their units: '+known+'. Meals already saved: '+all().map(function(r){return r.name}).join(', ')+'. Suggest 3 new, different meals for 4 servings that use pantry items first and share ingredients with each other. Leave out oil, salt, pepper and spices. Use known item names and units exactly where you can. For an item that is not known, give its unit and a typical US grocery price for one unit. Reply with only a JSON array like [{"name":"","type":"L or D or B","ing":[{"name":"","qty":1,"unit":"each","price":2.0}]}].';
    var run=ai.json?ai.json(q):ai(q).then(function(r){return JSON.parse(r.text.slice(r.text.indexOf('['),r.text.lastIndexOf(']')+1))});
    Promise.resolve(run).then(function(v){aiBusy=false;if(!Array.isArray(v))throw 0;
      change(function(){v.slice(0,3).forEach(function(r,i){if(!r||!r.name||!Array.isArray(r.ing))return;var ing=[];r.ing.forEach(function(x){var k=norm(x.name),qy=+x.qty;if(!k||!(qy>0))return;

        if(ing.length)state.recipes.push({id:'c'+Date.now()+i,name:String(r.name).slice(0,60),type:/^[LDB]$/.test(r.type)?r.type:'B',ing:ing})})},true)})
    .catch(function(e){aiBusy=false;aiErr=(e&&e.code)==='rate_limited'?'Too many requests right now. Try again in a minute.':'No suggestions came back. Try again.';render()})}
};
